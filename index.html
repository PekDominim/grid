<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="grid-layout">
        <header class="collective">
            <h1>Collection of spinning shit on the web</h1>
        </header>
        <aside class="collective">
            <h2>Honorable mentions</h2>

            <div>
                <img src="fsh-spin.gif" alt="">
                <p>spinning fish</p>
            </div>

            <div>
                <img src="seal-spinning-around.gif" alt="">
                <p>spinning seal</p>
            </div>

            <div>
                <img src="skull.gif" alt="">
                <p>spinning skull</p>
            </div>
        </aside>
        <main class="collective">
            <h2>Star of the show, spinning chip</h2>
            <figure>
                <img src="chip.gif" alt="chip">

                <figcaption>spinning chip</figcaption>
                <audio controls>
                    <source src="Lipps Inc. - Funkytown (Official Audio) [Z6dqIYKIBSU].mp3" type="audio/mpeg">
                </audio>
                <p>Spinning Chip refers to a viral video showing a potato chip rotating for an hour while "Funky Town"
                    by Lipps Inc. plays in the background. The video went viral on TikTok due in large part to people
                    finding it absurdly humorous, similar to other examples such as Spinning Cat and Horizontally
                    Spinning Rat.</p>
                <img src="cat-spinning.gif" alt="">
                <img src="rat-spin.gif" alt="">
            </figure>

        </main>
        <footer class="collective">
            <p>Elérhetőség: You don't want to talk to me, trust me</p>
            <p>&copy;2026 The one and only Pék Dominik</p>
        </footer>
    </div>
</body>

</html>
